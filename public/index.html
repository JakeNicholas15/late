<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="version" content="1.1.0">
<title>Sorry I'm Late</title>
<meta name="description" content="An Atlanta traffic excuse generator.">
<meta property="og:title" content="Sorry I'm Late">
<meta property="og:description" content="An Atlanta traffic excuse generator.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
<style>
:root { --bg: #111; --fg: #fff; --dim: #888; --peach: #ff9a6b; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); margin: 0; font: 18px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; display: flex; flex-direction: column; }
main { flex: 1; width: 100%; max-width: 750px; margin: 0 auto; padding: 48px 16px 24px; display: flex; flex-direction: column; justify-content: center; }
h1 { font-size: 15px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 0 0 24px; }
#excuse { font-size: clamp(28px, 6vw, 44px); line-height: 1.25; font-weight: 700; margin: 0 0 36px; min-height: 4em; }
#excuse .place { color: var(--peach); }
.buttons { display: flex; gap: 12px; flex-wrap: wrap; }
button { font: inherit; font-weight: 600; border-radius: 999px; padding: 14px 24px; cursor: pointer; border: 2px solid var(--fg); }
#again { background: var(--fg); color: var(--bg); }
#copy { background: transparent; color: var(--fg); }
button:active { transform: scale(.97); }
footer { max-width: 750px; width: 100%; margin: 0 auto; padding: 16px; color: var(--dim); font-size: 14px; }
footer a { color: var(--dim); }
footer { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 8px 24px; }
.jake { text-decoration: none; line-height: 1.35; }
.jake span { display: block; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.jake b { color: var(--fg); text-decoration: underline; text-decoration-color: var(--dim); text-underline-offset: 3px; }
.jake:hover b { text-decoration-color: var(--peach); }
</style>
<script defer src="https://jakethings.com/jt.js"></script>
</head>
<body>
<main>
<h1>Sorry I'm Late &middot; Atlanta edition</h1>
<p id="excuse" aria-live="polite"></p>
<div class="buttons">
<button id="again">Another excuse</button>
<button id="copy">Copy text</button>
</div>
</main>
<footer>
<a class="jake" href="https://jakethings.com"><span>A Jake Thing</span><b>JakeThings.com</b></a>
<span>v1.1.0 &middot; <span id="count"></span> possible excuses</span>
</footer>
<script>
const openers = [
  "Sorry I'm late,",
  "Running a few minutes behind,",
  "On my way, but",
  "Bad news:",
  "You won't believe this, but",
  "Heads up,",
  "Don't be mad,",
  "So, funny story,"
];
const incidents = [
  "there's a mattress in the left lane of",
  "a ladder fell off a pickup on",
  "a guy on a scooter is going 9 mph down the middle of",
  "it's a parking lot again on",
  "a film crew shut down",
  "the Waffle House line spilled onto",
  "a family of geese is holding traffic hostage on",
  "someone's boat came unhitched on",
  "everybody slowed down to look at a fender bender on",
  "it rained for four minutes on",
  "there's a pothole the size of a hot tub on",
  "Google Maps sent me through a neighborhood off",
  "a parade I've never heard of took over",
  "the pollen is so thick I can't see",
  "a Beltline crowd spilled onto",
  "a truck full of sweet tea tipped over on",
  "the construction that started in 2009 is still going on",
  "a couch (just a couch, no truck) is sitting on",
  "a Braves game let out right onto",
  "a cop is just sitting there, so everyone's doing 40 on",
  "somebody is drifting donuts in the middle of",
  "a lane closed for no visible reason on"
];
const places = [
  "the Connector",
  "Spaghetti Junction",
  "the top end of 285",
  "the bottom end of 285",
  "GA-400",
  "Moreland Ave",
  "Ponce",
  "Peachtree (not that one, the other one)",
  "Buford Highway",
  "DeKalb Ave",
  "Northside Drive",
  "North Avenue",
  "Freedom Parkway",
  "I-20 by the zoo",
  "Howell Mill",
  "Memorial Drive",
  "Cobb Parkway",
  "Piedmont",
  "Briarcliff",
  "the 75/85 split"
];
const closers = [
  "ETA unknown.",
  "Be there in 5. Atlanta 5.",
  "Order without me.",
  "Save me a seat.",
  "I'm basically there.",
  "Start without me.",
  "Maps says 12 minutes. Maps is lying.",
  "Leaving now. Well, soon.",
  "Tell everyone I said hi.",
  "Pray for me."
];
const lists = [openers, incidents, places, closers];
const $ = id => document.getElementById(id);
let current = [];

function pick() { return lists.map(l => Math.floor(Math.random() * l.length)); }

function show(idx) {
  current = idx;
  const [o, i, p, c] = idx.map((n, k) => lists[k][n]);
  const el = $("excuse");
  el.textContent = "";
  el.append(o + " " + i + " ");
  const span = document.createElement("span");
  span.className = "place";
  span.textContent = p;
  el.append(span, ". " + c);
  history.replaceState(null, "", "#" + idx.join("-"));
}

function text() {
  const [o, i, p, c] = current.map((n, k) => lists[k][n]);
  return o + " " + i + " " + p + ". " + c;
}

function fromHash() {
  const parts = location.hash.slice(1).split("-").map(Number);
  if (parts.length === 4 && parts.every((n, k) => Number.isInteger(n) && n >= 0 && n < lists[k].length)) return parts;
  return null;
}

$("again").onclick = () => {
  let next;
  do { next = pick(); } while (next.join() === current.join());
  show(next);
};

$("copy").onclick = async () => {
  try {
    await navigator.clipboard.writeText(text());
    $("copy").textContent = "Copied";
  } catch (e) {
    $("copy").textContent = "Couldn't copy";
  }
  setTimeout(() => { $("copy").textContent = "Copy text"; }, 1500);
};

$("count").textContent = lists.reduce((a, l) => a * l.length, 1).toLocaleString();
show(fromHash() || pick());
</script>
</body>
</html>
